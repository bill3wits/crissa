<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crissa">
<meta name="theme-color" content="#d9d2c8">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<link rel="icon" href="/app/icon-180.png">
<title>Crissa</title>
<style>
  :root {
    --wall: #d9d2c8;          /* the plate behind her */
    --ink: #2b2723;
    --ink-soft: #6d655d;
    --glass: rgba(250, 247, 243, 0.78);
    --line: rgba(43, 39, 35, 0.14);
    --accent: #8a5a44;        /* her lips, not a brand orange */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --glass: rgba(32, 29, 27, 0.72);
      --ink: #f2ede7;
      --ink-soft: #b8afa5;
      --line: rgba(242, 237, 231, 0.16);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--wall); color: var(--ink);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#face { width: 100%; height: 100%; object-fit: cover; display: block; }
  video.film { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #caption { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
    bottom: calc(80px + env(safe-area-inset-bottom)); text-align: center; font-size: 16px; color: var(--ink);
    padding: 8px 14px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); }
  #caption:empty { display: none; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 26px;
    background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); }
  #mode { border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-size: 15px;
    padding: 8px 10px; border-radius: 18px; min-width: 56px; }
  #mode:focus-visible, #send:focus-visible, #text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #text { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit;
    padding: 8px 4px; outline: none; }
  #text::placeholder { color: var(--ink-soft); }
  #send { border: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 18px; display: grid; place-items: center; }
  #send[disabled] { opacity: .45; }
  #sync { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; border: 0;
    background: var(--glass); color: var(--ink-soft); border-radius: 16px; padding: 6px 10px; font-size: 13px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #syncPanel { position: fixed; top: calc(48px + env(safe-area-inset-top)); right: 12px; left: 12px; max-width: 360px;
    margin-left: auto; padding: 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: none; font-size: 15px; }
  #syncPanel.open { display: block; }
  #syncPanel input { width: 100%; }
  #syncPanel p { margin: 0 0 8px; color: var(--ink-soft); font-size: 13px; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: calc(64px + env(safe-area-inset-bottom)); background: transparent; border: 0; color: var(--ink);
    font: inherit; }
  #start span { background: var(--glass); padding: 12px 22px; border-radius: 24px; border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 17px; }
  #start.gone { display: none; }
  #conn { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 84px; width: max-content;
    max-width: calc(100% - 96px); border: 0; background: var(--glass); color: var(--ink-soft); border-radius: 16px;
    padding: 6px 10px; font: inherit; font-size: 13px; text-align: left; overflow: hidden;
    /* the whole address, on two lines if it must (a buyer reads it against the computer's) */
    white-space: normal; overflow-wrap: anywhere; line-height: 1.3;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #conn:empty { display: none; }
  #connect { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0, 0, 0, .35); }
  #connect.open { display: flex; }
  #connect .card { width: 100%; max-width: 380px; padding: 18px; border-radius: 18px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  #connect h2 { margin: 0 0 6px; font-size: 18px; }
  #connect p { margin: 0 0 12px; color: var(--ink-soft); font-size: 14px; }
  #connect p.why { color: var(--ink); }
  #connect p.why:empty { display: none; }
  #connect button { display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px; margin: 0 0 8px;
    font: inherit; font-size: 16px; background: var(--accent); color: #fff; }
  #connect button.quiet { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  #connect button[hidden] { display: none; }
  .thinking #send { animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .thinking #send { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div id="stage"><canvas id="face" width="720" height="1280" aria-label="Crissa"></canvas></div>
<div id="caption" aria-live="polite"></div>
<button id="sync" type="button" aria-expanded="false">Sync</button>
<button id="conn" type="button" aria-haspopup="dialog"></button>
<div id="connect" role="dialog" aria-modal="true" aria-labelledby="connectTitle">
  <div class="card">
    <h2 id="connectTitle">Connect</h2>
    <p id="connectNow"></p>
    <p id="connectWhy" class="why"></p>
    <button id="useHouse" type="button"></button>
    <button id="leaveHouse" type="button" class="quiet">Disconnect</button>
    <p>Or scan the QR code under Your phone in Crissa's menu on your computer.</p>
    <p>Connecting straight to your own agent is coming in the Crissa app.</p>
    <button id="connectClose" type="button" class="quiet">Close</button>
  </div>
</div>
<div id="syncPanel">
  <p>Move her mouth earlier or later than her voice.</p>
  <label for="lead">Mouth <output id="leadOut">0 ms</output></label>
  <!-- .101 10-19: -250 was not far enough on a desktop browser (the pack's lead is a phone's hand tune) -->
  <input id="lead" type="range" min="-600" max="600" step="10" value="0">
</div>
<form id="bar" autocomplete="off">
  <button id="mode" type="button" title="Chat: she answers. Say: she says what you type.">Chat</button>
  <input id="text" enterkeyhint="send" placeholder="Talk to Crissa" aria-label="Message">
  <button id="send" type="submit" aria-label="Send">&#8593;</button>
</form>
<button id="start" type="button"><span>Tap to wake Crissa</span></button>
<script src="/app/app.js"></script>
</body>
</html>
